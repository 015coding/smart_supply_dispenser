name: smart-supply-dispenser

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: "https://${APP_DOMAIN:-smart_supply_dispenser.kubits.org}"
        NEXT_PUBLIC_MAP_TILE_URL: "${NEXT_PUBLIC_MAP_TILE_URL:-https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png}"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"
      AUTH_URL: "https://${APP_DOMAIN:-smart_supply_dispenser.kubits.org}"
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: "${AUTH_SECRET:?Set AUTH_SECRET in .env.compose}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env.compose}"
      ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH:?Set ADMIN_PASSWORD_HASH in .env.compose}"
      DEVICE_SHARED_SECRET: "${DEVICE_SHARED_SECRET:?Set DEVICE_SHARED_SECRET in .env.compose}"
      PII_ENCRYPTION_KEY: "${PII_ENCRYPTION_KEY:?Set PII_ENCRYPTION_KEY in .env.compose}"
      PII_LOOKUP_KEY: "${PII_LOOKUP_KEY:?Set PII_LOOKUP_KEY in .env.compose}"
      BLOB_READ_WRITE_TOKEN: "${BLOB_READ_WRITE_TOKEN:-}"
      IMAGE_UPLOAD_DIR: /app/uploads
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-false}"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - next_cache:/app/.next/cache
      - image_uploads:/app/uploads
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/openapi.json').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  next_cache:
  image_uploads:
